apiVersion: v1
kind: Namespace
metadata:
  name: ecoride
---
# 1. ConfigMap for Non-sensitive Variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecoride-config
  namespace: ecoride
data:
  NODE_ENV: "production"
  PORT: "4000"
  BACKEND_URL: "https://api.ecoride.company.com"
  NEXT_PUBLIC_API_URL: "https://api.ecoride.company.com"
  REDIS_URL: "redis://ecoride-cache-service:6379"
---
# 2. Redis Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoride-cache
  namespace: ecoride
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecoride-cache
  template:
    metadata:
      labels:
        app: ecoride-cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ecoride-cache-service
  namespace: ecoride
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: ecoride-cache
---
# 3. Backend Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoride-backend
  namespace: ecoride
spec:
  replicas: 3 # Scaled for high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ecoride-backend
  template:
    metadata:
      labels:
        app: ecoride-backend
    spec:
      containers:
      - name: backend
        image: ecoride-registry.azurecr.io/ecoride-backend:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: ecoride-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ecoride-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecoride-secrets
              key: JWT_SECRET
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ecoride-backend-service
  namespace: ecoride
spec:
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: ecoride-backend
---
# 4. Frontend Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoride-frontend
  namespace: ecoride
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ecoride-frontend
  template:
    metadata:
      labels:
        app: ecoride-frontend
    spec:
      containers:
      - name: frontend
        image: ecoride-registry.azurecr.io/ecoride-frontend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: ecoride-config
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ecoride-frontend-service
  namespace: ecoride
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: ecoride-frontend
---
# 5. Ingress Controller routing rules
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecoride-ingress
  namespace: ecoride
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - ecoride.company.com
    secretName: ecoride-tls-cert
  rules:
  - host: ecoride.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecoride-frontend-service
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ecoride-backend-service
            port:
              number: 4000
